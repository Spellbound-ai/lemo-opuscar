<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#07080c;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
const W = 1920, H = 1080;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const CUES = await (await fetch('cues.json')).json();
window.DUR = 464.0;

// ---------- palette ----------
const C = {
  bg: '#07080c', s1: '#10131b', s2: '#161a24', s3: '#1d2230',
  line: 'rgba(255,255,255,0.08)', t1: '#eef1f7', t2: '#a3abbd', t3: '#5f6779',
  acc: '#8B7CFF', accSoft: 'rgba(139,124,255,0.18)', red: '#FF5A5F', redSoft: 'rgba(255,90,95,0.16)',
};
const F = 'Inter', FD = 'Inter Display', FM = 'JetBrains Mono';

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eo = k => 1 - Math.pow(1 - clamp(k), 3);
const eio = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const back = k => { k = clamp(k); const s = 1.3; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
let T = 0;                                   // absolute time
const P = (t0, d = .35) => clamp((T - t0) / d);          // linear progress since t0
const IN = (t0, d = .35) => back(P(t0, d));               // pop-in with overshoot
const EO = (t0, d = .5) => eo(P(t0, d));
const hash = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function panel(x, y, w, h, o = {}) {
  const a = o.a ?? 1; if (a <= 0) return;
  g.save(); g.globalAlpha *= a;
  g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 40; g.shadowOffsetY = 14;
  rr(x, y, w, h, o.r ?? 18); g.fillStyle = o.fill || C.s2; g.fill();
  g.shadowColor = 'transparent';
  g.lineWidth = o.lw || 1.5; g.strokeStyle = o.stroke || C.line; g.stroke();
  if (o.glow) { g.shadowColor = o.glow; g.shadowBlur = 36; g.strokeStyle = o.glow; g.lineWidth = 2; rr(x, y, w, h, o.r ?? 18); g.stroke(); }
  g.restore();
}
function tx(s, x, y, o = {}) {
  const a = o.a ?? 1; if (a <= 0) return 0;
  g.save(); g.globalAlpha *= a;
  g.font = `${o.w || 500} ${o.size || 32}px "${o.f || F}"`;
  g.fillStyle = o.c || C.t1; g.textAlign = o.al || 'left'; g.textBaseline = o.bl || 'alphabetic';
  if (o.ls) g.letterSpacing = o.ls + 'px';
  if (o.glow) { g.shadowColor = o.glow; g.shadowBlur = o.gb || 30; }
  g.fillText(s, x, y);
  const w = g.measureText(s).width; g.restore(); return w;
}
function wrap(s, maxW, size, w = 500, f = F) {
  g.font = `${w} ${size}px "${f}"`; const words = s.split(' '), lines = []; let cur = '';
  for (const wd of words) { const tst = cur ? cur + ' ' + wd : wd; if (g.measureText(tst).width > maxW && cur) { lines.push(cur); cur = wd; } else cur = tst; }
  if (cur) lines.push(cur); return lines;
}
function para(s, x, y, maxW, o = {}) {
  const size = o.size || 32, lh = size * (o.lh || 1.4);
  wrap(s, maxW, size, o.w || 500, o.f || F).forEach((l, i) => tx(l, x, y + i * lh, o));
}
function label(s, x, y, o = {}) { return tx(s.toUpperCase(), x, y, { f: FM, size: o.size || 20, w: 600, c: o.c || C.t3, ls: 3, ...o }); }
function line(x1, y1, x2, y2, c = C.line, w = 2, a = 1) { g.save(); g.globalAlpha *= a; g.strokeStyle = c; g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); g.restore(); }
function dot(x, y, r, c, a = 1, glow) { if (a <= 0) return; g.save(); g.globalAlpha *= a; if (glow) { g.shadowColor = glow; g.shadowBlur = r * 3; } g.fillStyle = c; g.beginPath(); g.arc(x, y, Math.max(0, r), 0, 7); g.fill(); g.restore(); }
function ring(x, y, r, c, w = 2, a = 1, dash) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.strokeStyle = c; g.lineWidth = w; if (dash) g.setLineDash(dash); g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke(); g.restore(); }
function arc(x, y, r, a0, a1, c, w = 3, a = 1) { g.save(); g.globalAlpha *= a; g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.arc(x, y, r, a0, a1); g.stroke(); g.restore(); }
function chip(s, x, y, o = {}) {
  const size = o.size || 26; g.font = `${o.w || 600} ${size}px "${F}"`;
  const w = g.measureText(s).width + size * 1.4, h = size * 1.9;
  const xx = o.al === 'center' ? x - w / 2 : o.al === 'right' ? x - w : x;
  const k = o.k ?? 1; if (k <= 0) return w;
  g.save(); g.translate(xx + w / 2, y + h / 2); g.scale(k, k); g.translate(-(xx + w / 2), -(y + h / 2));
  panel(xx, y, w, h, { r: h / 2, fill: o.fill || C.s3, stroke: o.stroke || C.line, glow: o.glow, a: o.a });
  tx(s, xx + w / 2, y + h / 2 + size * .36, { size, w: o.w || 600, c: o.c || C.t1, al: 'center', a: o.a });
  g.restore(); return w;
}
function check(x, y, s, k, c = C.acc) { if (k <= 0) return; g.save(); g.strokeStyle = c; g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
  const pts = [[x - s * .5, y], [x - s * .15, y + s * .35], [x + s * .5, y - s * .4]]; const L1 = .4;
  g.moveTo(...pts[0]); if (k < L1) g.lineTo(lerp(pts[0][0], pts[1][0], k / L1), lerp(pts[0][1], pts[1][1], k / L1)); else { g.lineTo(...pts[1]); const q = (k - L1) / (1 - L1); g.lineTo(lerp(pts[1][0], pts[2][0], q), lerp(pts[1][1], pts[2][1], q)); }
  g.stroke(); g.restore(); }
function cross(x, y, s, k, c = C.red) { if (k <= 0) return; const a = clamp(k * 2), b = clamp(k * 2 - 1);
  line(x - s, y - s, lerp(x - s, x + s, a), lerp(y - s, y + s, a), c, 5); if (b > 0) line(x + s, y - s, lerp(x + s, x - s, b), lerp(y - s, y + s, b), c, 5); }
function strike(x, y, w, k, c = C.red) { if (k > 0) line(x, y, x + w * eo(k), y, c, 4); }
function scramble(val, t0, dur = .9) {           // number locks digit by digit
  const p = (T - t0) / dur; if (p >= 1) return val;
  return val.split('').map((ch, i) => { if (!/[0-9]/.test(ch)) return ch; if (p > (i + 1) / (val.length + 1)) return ch; return String(Math.floor(hash(Math.floor(T * 24) + i * 7) * 10)); }).join('');
}
function bigNum(s, x, y, size, o = {}) { return tx(s, x, y, { f: FD, w: 700, size, ls: -size * .04, al: o.al || 'center', c: o.c || C.t1, glow: o.glow, gb: o.gb || 60, a: o.a }); }
function header(kicker, title, t0, o = {}) {
  const a = EO(t0, .4), dy = (1 - a) * 18;
  label(kicker, o.x ?? 120, 120 + dy, { a, c: o.kc || C.acc });
  tx(title, o.x ?? 120, 182 + dy, { size: o.size || 52, w: 700, a });
}

// ---------- stage ----------
function stage() {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  let gr = g.createRadialGradient(W * .5, -100, 50, W * .5, -100, 1300);
  gr.addColorStop(0, 'rgba(70,80,120,0.22)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  gr = g.createRadialGradient(W * .82, H * .75, 0, W * .82, H * .75, 800);
  gr.addColorStop(0, 'rgba(139,124,255,0.06)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
function grid(cam) {
  g.save(); g.lineWidth = 1;
  const m = 48, x0 = -Math.ceil(W / m) * m, y0 = -Math.ceil(H / m) * m;
  for (let i = 0, x = x0; x < W * 2; x += m, i++) { g.strokeStyle = i % 4 ? 'rgba(255,255,255,0.025)' : 'rgba(255,255,255,0.05)'; g.beginPath(); g.moveTo(x, y0); g.lineTo(x, H * 2); g.stroke(); }
  for (let i = 0, y = y0; y < H * 2; y += m, i++) { g.strokeStyle = i % 4 ? 'rgba(255,255,255,0.025)' : 'rgba(255,255,255,0.05)'; g.beginPath(); g.moveTo(x0, y); g.lineTo(W * 2, y); g.stroke(); }
  g.restore();
}
function vignette() {
  const gr = g.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.05);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.55)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
}

// ============ SCENES ============
// --- shared: round table of five seats ---
const SEAT_T = [[6.2, 11.0], [11.8, 17.5], [18.1, 24.4], [25.4, 31.3], [32.0, 39.3]];
function table(cx, cy, R, o = {}) {
  const pop = o.pop ?? 1;
  g.save(); g.globalAlpha *= o.a ?? 1;
  // table
  g.save(); g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 50;
  g.beginPath(); g.arc(cx, cy, R * .62, 0, 7); g.fillStyle = C.s1; g.fill(); g.restore();
  ring(cx, cy, R * .62, C.line, 1.5); ring(cx, cy, R * .5, 'rgba(255,255,255,.04)', 1);
  // case file in the middle
  const fk = o.file ?? 1;
  if (fk > 0) {
    g.save(); g.translate(cx, cy); g.rotate(-.06); g.scale(fk, fk);
    panel(-80, -100, 160, 200, { r: 10, fill: C.s3 });
    label('HỒ SƠ', -58, -66, { size: 15, c: C.t2 });
    for (let i = 0; i < 6; i++) { g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(-58, -44 + i * 22, 116 * (i % 3 === 2 ? .6 : .9), 6); }
    if (o.dx) { rr(-60, 70, 120, 26, 6); g.fillStyle = C.acc; g.globalAlpha *= o.dx; g.fill(); tx('CHẨN ĐOÁN', 0, 89, { size: 15, w: 700, f: FM, al: 'center', c: '#0b0b14' }); }
    g.restore();
  }
  for (let i = 0; i < 5; i++) {
    const ang = -Math.PI / 2 + i * Math.PI * 2 / 5;
    const x = cx + Math.cos(ang) * R, y = cy + Math.sin(ang) * R;
    const k = o.seatK ? o.seatK(i) : pop;
    if (k <= 0) continue;
    const act = o.active ? o.active(i) : 0, empty = o.empty ? o.empty(i) : 0;
    g.save(); g.translate(x, y); g.scale(k, k);
    if (act > 0) dot(0, 0, 70, C.accSoft, act);
    g.beginPath(); g.arc(0, 0, 46, 0, 7); g.fillStyle = act > .5 ? '#221d44' : C.s3; g.globalAlpha *= 1 - empty * .85; g.fill(); g.globalAlpha /= Math.max(.01, 1 - empty * .85);
    ring(0, 0, 46, act > 0 ? C.acc : 'rgba(255,255,255,.18)', act > 0 ? 3 : 1.5, 1 - empty);
    ring(0, 0, 46, C.t3, 2, empty, [6, 7]);
    if (empty < 1) {   // simple person glyph
      g.globalAlpha *= 1 - empty;
      dot(0, -10, 13, act > 0 ? C.acc : C.t2);
      g.beginPath(); g.arc(0, 26, 22, Math.PI, 0); g.fillStyle = act > 0 ? C.acc : C.t2; g.fill();
      g.globalAlpha /= Math.max(.01, 1 - empty);
    }
    if (o.hat) { const hk = o.hat(i); if (hk > 0) { g.save(); g.globalAlpha *= hk; rr(-26, -78, 52, 18, 5); g.fillStyle = C.acc; g.fill(); rr(-16, -96, 32, 20, 4); g.fill(); g.restore(); } }
    g.restore();
    label(String(i + 1).padStart(2, '0'), x, y + 78, { al: 'center', size: 18, a: k * (o.numA ?? 1), c: act > 0 ? C.acc : C.t3 });
  }
  g.restore();
}
const seatAct = i => { const [a, b] = SEAT_T[i]; return clamp((T - a) / .3) * clamp((b + .3 - T) / .3); };

// Scene 1: the consult (0–46.3)
function sc1() {
  const cx = 560, cy = 500, R = 290;
  table(cx, cy, R, { file: IN(.4, .5), seatK: i => IN(3.4 + i * .35, .4), active: seatAct, dx: P(42.8, .4) });
  label('HỘI CHẨN · CA KHÓ', cx, 110, { al: 'center', a: EO(.3), c: C.t2 });
  // right panel content per speaker
  const px = 1060, py = 220, pw = 740;
  const hyp = [['Giả thuyết A', .62], ['Giả thuyết B', .24], ['Giả thuyết C', .14]];
  const after = EO(40.6, .9);           // results return: B rises
  const vals = [lerp(.62, .18, after), lerp(.24, .71, after), lerp(.14, .11, after)];
  const pa = EO(7.9, .5);
  panel(px, py, pw, 600, { a: pa, fill: C.s1 });
  if (pa > 0) {
    label('Người 01 · giả thuyết', px + 40, py + 56, { a: pa * (T < 11.8 ? 1 : .55), c: T < 11.8 ? C.acc : C.t3 });
    hyp.forEach(([n, v], j) => {
      const y = py + 100 + j * 62, k = EO(8.2 + j * .45, .6);
      const wrong = j === 0 ? EO(20.0, .4) * (1 - after) : 0;
      tx(n, px + 40, y + 28, { size: 28, w: 600, a: k, c: wrong > .5 ? C.red : C.t1 });
      rr(px + 260, y + 6, 420, 28, 8); g.fillStyle = 'rgba(255,255,255,.05)'; g.fill();
      rr(px + 260, y + 6, 420 * vals[j] * k, 28, 8); g.fillStyle = wrong > .5 ? C.red : (j === 1 && after > .5 ? C.acc : '#4a5168'); g.fill();
      tx(Math.round(vals[j] * 100) + '%', px + 690, y + 29, { size: 22, f: FM, w: 600, al: 'right', a: k * .0 });
    });
    // tests (#2)
    const tk = EO(13.9, .5);
    label('Người 02 · 3 xét nghiệm', px + 40, py + 330, { a: tk, c: T > 11.8 && T < 18.1 ? C.acc : C.t3 });
    ['XN-1', 'XN-2', 'XN-3'].forEach((s, j) => {
      const xk = IN(14.3 + j * .4, .35);
      const crossed = j === 2 ? P(27.5, .5) : 0;
      chip(s, px + 40 + j * 150, py + 356, { k: xk, size: 24, fill: crossed > .5 ? C.s1 : C.s3, c: crossed > .5 ? C.t3 : C.t1 });
      if (j === 2) { cross(px + 40 + j * 150 + 54, py + 378, 26, crossed); if (crossed > 0) label('$$$ · ít giá trị', px + 40 + j * 150 - 10, py + 450, { a: crossed, c: C.red, size: 16 }); }
    });
    if (T > 29.6) chip('Phương án rẻ hơn → làm trước', px + 40, py + 470 - 0, { k: IN(29.8, .35), size: 22, stroke: C.acc });
    // warning #3
    const wk = IN(20.2, .35) * (1 - EO(40.2, .5));
    if (wk > 0) { g.save(); g.translate(px + pw - 40, py + 128); g.scale(wk, wk); panel(-250, -40, 250, 80, { fill: '#2a1418', stroke: C.red, r: 12 }); tx('⚠ Không khớp A', -125, 10, { size: 24, w: 700, c: C.red, al: 'center' }); g.restore(); }
    if (T > 22.6 && T < 40.2) tx('Đừng vội kết luận', px + pw - 165, py + 70 + 0, { size: 20, w: 600, c: C.red, al: 'center', a: EO(22.6) * (1 - EO(39.6)) });
    // checklist #5
    const ck = EO(33.8, .5);
    if (ck > 0) {
      label('Người 05 · kiểm tra', px + 40, py + 545, { a: ck, c: T < 40.2 ? C.acc : C.t3 });
      [['Tên xét nghiệm', 36.0], ['Lập luận nhất quán', 38.6]].forEach(([s, t], j) => { check(px + 360 + j * 200, py + 538, 22, P(t, .4)); tx(s, px + 384 + j * 200, py + 546, { size: 20, w: 500, c: C.t2, a: P(t, .3) }); });
    }
  }
  // loop arrows around the table for rounds (40.2)
  const lk = P(40.2, 2.4);
  if (lk > 0 && lk < 1) for (let r = 0; r < 3; r++) { const a0 = -Math.PI / 2 + (lk * 3 - r) * Math.PI * 2; arc(cx, cy, R + 110, a0, a0 + 1.2, C.acc, 3, clamp(1 - Math.abs(lk * 3 - r - .5) * 2)); }
  if (T > 42.8) { const k = IN(42.9, .4); g.save(); g.translate(cx, cy + R + 150); g.scale(k, k); chip('ĐÃ CHỐT · Giả thuyết B', 0, -24, { al: 'center', size: 26, fill: '#221d44', stroke: C.acc, glow: C.acc }); g.restore(); }
}

// Scene 2: the twist (46.3–62.9)
function sc2() {
  const k = eio(P(53.8, 1.2));
  const cx = lerp(560, 960, k), cy = 500, R = 290;
  const merge = eio(P(57.4, 1.4));
  if (merge < 1) table(cx, cy, R * (1 - merge * .99), { file: 1 - merge, pop: 1, active: () => clamp((50.8 - T) / .4) * clamp((T - 46.3) / .3), empty: i => P(51.3 + i * .18, .35) * (1 - P(54.5, .4)), numA: 1 - merge,
    hat: i => 0 });
  // at 54.5: five separate machines (chips) replace seats
  if (T > 54.5 && merge < 1) for (let i = 0; i < 5; i++) {
    const ang = -Math.PI / 2 + i * Math.PI * 2 / 5, rr2 = R * (1 - merge);
    const x = cx + Math.cos(ang) * rr2, y = cy + Math.sin(ang) * rr2, kk = IN(54.6 + i * .1, .3) * (1 - merge * .5);
    g.save(); g.translate(x, y); g.scale(kk, kk); panel(-44, -44, 88, 88, { r: 14, fill: C.s3, stroke: 'rgba(255,255,255,.2)' });
    for (let j = 0; j < 3; j++) { g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(-26, -20 + j * 16, 52, 6); } g.restore();
    if (T > 55.3 && T < 57.6) cross(x, y, 30, P(55.4 + i * .08, .3) * (1 - merge));
  }
  if (merge > 0) {
    const cxx = 960, ck = back(clamp((T - 57.6) / .5));
    dot(cxx, cy, 160 * ck, 'rgba(139,124,255,.08)');
    g.save(); g.translate(cxx, cy); g.scale(ck, ck);
    g.beginPath(); g.arc(0, 0, 92, 0, 7); g.fillStyle = '#1b1735'; g.fill(); ring(0, 0, 92, C.acc, 3, 1); g.restore();
    tx('1 MODEL AI', cxx, cy + 12, { size: 30, w: 700, al: 'center', a: ck, glow: C.acc });
    // five hats orbiting
    const names = ['Giả thuyết', 'Xét nghiệm', 'Phản biện', 'Chi phí', 'Kiểm tra'];
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * Math.PI * 2 / 5 + (T - 58) * .25, r = 210, hk = IN(58.2 + i * .35, .35);
      const x = cxx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      const lit = T > 61 ? (Math.floor((T - 61) * 2.2) % 5 === i ? 1 : .35) : 1;
      g.save(); g.translate(x, y); g.scale(hk, hk); g.globalAlpha = lit;
      rr(-34, -10, 68, 22, 6); g.fillStyle = C.acc; g.fill(); rr(-20, -32, 40, 24, 5); g.fill(); g.restore();
      tx(names[i], x, y + 46, { size: 20, w: 600, al: 'center', c: C.t2, a: hk * lit });
    }
    if (T > 61) { const i = Math.floor((T - 61) * 2.2) % 5, j = (i + 1) % 5; const a = i2 => -Math.PI / 2 + i2 * Math.PI * 2 / 5 + (T - 58) * .25;
      const q = ((T - 61) * 2.2) % 1; dot(lerp(cxx + Math.cos(a(i)) * 210, cxx + Math.cos(a(j)) * 210, q), lerp(cy + Math.sin(a(i)) * 210, cy + Math.sin(a(j)) * 210, q), 7, C.acc, 1, C.acc); }
  }
  if (T > 51.1 && T < 57.3) tx('0 bác sĩ', 1500, 520, { size: 64, w: 700, al: 'center', a: EO(51.4) * (1 - EO(56.8)), c: C.t1 });
  if (T > 54.5 && T < 57.3) label('không phải 5 cỗ máy', 1500, 580, { al: 'center', a: EO(54.6) * (1 - EO(56.8)), c: C.red });
  if (merge > .9) label('đội lần lượt 5 chiếc mũ · tự cãi nhau với chính mình', 960, 860, { al: 'center', a: EO(59.5), c: C.t2, size: 20 });
}

// Scene 3: MAI-DxO, 83 vs 36 (62.9–78.7)
function sc3() {
  const swap = eio(P(70.8, .8));
  const ta = 1 - swap;
  // light reveal of the name
  const rv = clamp((T - 63.0) / 1.2);
  if (ta > 0) {
    g.save(); g.beginPath(); g.rect(0, 0, W * rv + 200, H); g.clip();

      for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; line(Math.cos(a) * 160, Math.sin(a) * 160, Math.cos(a) * 178, Math.sin(a) * 178, C.t2, 3); }
      const m = (T - 435) * .02; line(0, 0, Math.sin(m) * 150, -Math.cos(m) * 150, C.t1, 4); line(0, 0, 0, -100, C.t1, 6); dot(0, 0, 8, C.acc);
      g.restore();
      label('00:00 · tuyến dưới', 560, 740, { al: 'center', a: k });
      tx('Hỏi ai trước?', 1300, 380, { size: 52, w: 750, al: 'center', a: EO(436.5) });
      chip('AI', 1140, 470, { al: 'center', size: 34, k: IN(439.2), fill: '#221d44', stroke: C.acc });
      chip('Chờ chuyên gia tới sáng', 1420, 470, { al: 'center', size: 30, k: IN(440.2) });
      g.restore(); }
    if (sub > 0) { g.save(); g.globalAlpha = sub;
      const k = IN(441.6);
      g.save(); g.translate(560, 500); g.scale(k, k); chip('AI', 0, -40, { al: 'center', size: 48, fill: '#221d44', stroke: C.acc }); g.restore();
      g.save(); g.translate(1360, 500); g.scale(k, k); chip('Chuyên gia', 0, -40, { al: 'center', size: 48 }); g.restore();
      tx('≠', 960, 520, { size: 110, w: 700, al: 'center', c: C.red, a: EO(442.4) });
      label('Quy định pháp lý ghi nhận', 960, 680, { al: 'center', a: EO(444.1) });
      tx('Ai có quyền nói lời cuối cùng?', 960, 760, { size: 56, w: 750, al: 'center', a: EO(445.5) });
      g.restore(); }
    return;
  }
  // 10 years: two paths
  header('10 năm nữa', 'Bác sĩ đầu ngành thế hệ sau lớn lên từ đâu?', 448.4);
  const x0 = 300, y0 = 560;
  dot(x0, y0, 20, C.t1, EO(448.6));
  const k1 = EO(451.2, 2.5), k2 = EO(454.8, 2.5);
  g.save(); g.lineWidth = 5; g.lineCap = 'round';
  g.strokeStyle = C.acc; g.beginPath(); for (let i = 0; i <= 50 * k1; i++) { const q = i / 50; g.lineTo(x0 + q * 1150, y0 - Math.sin(q * Math.PI / 2) * 200 + Math.sin(q * 30) * 14 * (1 - q)); } g.stroke();
  g.strokeStyle = C.t3; g.setLineDash([10, 12]); g.beginPath(); for (let i = 0; i <= 50 * k2; i++) { const q = i / 50; g.lineTo(x0 + q * 1150, y0 + Math.sin(q * Math.PI / 2) * 200); } g.stroke(); g.restore();
  tx('Tranh luận nảy lửa với chuyên gia đi trước', 1480, 370, { size: 30, w: 650, al: 'right', a: EO(452.9) });
  tx('Câu trả lời có sẵn của máy móc', 1480, 800, { size: 30, w: 650, al: 'right', c: C.t2, a: EO(456.0) });
}

// Scene 16: outro (458.6–464)
function sc16() {
  const k = eio(P(461.6, 1.6));
  const r = lerp(260, 0, k);
  if (k < 1) table(960, 520, r, { file: 1 - k, active: i => i === 0 ? 1 : 0, numA: 1 - k, a: 1 });
  dot(960, 520, lerp(0, 16, k) * (1 - P(463.4, .4)), C.acc, 1, C.acc);
  tx('Hẹn gặp lại ở tập sau', 960, 900, { size: 36, w: 600, al: 'center', c: C.t2, a: EO(458.8) * (1 - EO(462.8)) });
}

const SCENES = [
  [0, sc1, [560, 500]], [46.3, sc2, [560, 500]], [62.9, sc3, [960, 520]], [78.7, sc4, [960, 520]], [93.7, sc5, [960, 400]],
  [108.7, sc6, [960, 420]], [157.1, sc7, [960, 540]], [203.1, sc8, [960, 540]], [232.1, sc9, [960, 340]], [254.2, sc10, [500, 500]],
  [282.8, sc11, [960, 520]], [322.5, sc12, [960, 500]], [393.8, sc13, [960, 500]], [410.5, sc14, [960, 520]], [423.6, sc15, [960, 520]], [458.6, sc16, [960, 520]],
];
// camera moves per scene: [startZoom, endZoom, panX, panY]
const CAM = [[1.06, 1.0, 0, 0], [1.0, 1.0, 0, 0], [1.0, 1.04, 0, 0], [1.0, 1.0, -30, 0], [1.0, 1.05, 0, 0], [1.02, 1.0, 0, 0], [1.0, 1.02, 0, 0], [1.0, 1.0, 20, 0],
  [1.04, 1.0, 0, 0], [1.0, 1.03, 0, 0], [1.0, 1.0, -20, 0], [1.0, 1.02, 0, 0], [1.03, 1.0, 0, 0], [1.0, 1.02, 0, 0], [1.08, 1.0, 0, 0], [1.0, 1.0, 0, 0]];

function drawScene(i, t) {
  const [t0, fn] = SCENES[i], t1 = SCENES[i + 1]?.[0] ?? window.DUR, [z0, z1, px, py] = CAM[i];
  const q = eio((t - t0) / (t1 - t0));
  const z = lerp(z0, z1, q);
  g.save(); g.translate(W / 2, H / 2); g.scale(z, z); g.translate(-W / 2 + px * q, -H / 2 + py * q);
  const saved = T; T = t; fn(); T = saved;
  g.restore();
}

// ---------- captions (toast) ----------
function capEnd(i) { const c = CUES[i], nx = CUES[i + 1]; return Math.min(nx ? nx.t0 - .02 : 1e9, Math.max(c.t1 + .35, c.t0 + 1.8)); }
function caption(t) {
  let i = -1; for (let j = 0; j < CUES.length; j++) if (t >= CUES[j].t0 && t < capEnd(j)) i = j;
  if (i < 0) return null;
  const c = CUES[i], k = clamp((t - c.t0) / .16), out = clamp((capEnd(i) - t) / .12);
  const a = Math.min(k, out); const size = 38;
  const lines = wrap(c.text, 1300, size, 500);
  g.font = `500 ${size}px "${F}"`; const w = Math.max(...lines.map(l => g.measureText(l).width)) + 110;
  const lh = size * 1.4, h = lines.length * lh + 34, x = W / 2 - w / 2, y = 1030 - h + (1 - k) * 10;
  g.save(); g.globalAlpha = a;
  g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 30; rr(x, y, w, h, Math.min(h / 2, 34)); g.fillStyle = 'rgba(14,16,24,0.88)'; g.fill();
  g.shadowColor = 'transparent'; g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 1.5; g.stroke();
  dot(x + 40, y + h / 2, 7, C.acc, .6 + .4 * Math.sin(t * 9));
  lines.forEach((l, j) => tx(l, x + 64, y + 17 + lh * j + lh * .5 + size * .36, { size, w: 500 }));
  g.restore();
  return { id: 'cap' + i, text: c.text, x0: x, y0: y, x1: x + w, y1: y + h };
}

// ---------- render ----------
const TR = .55;   // UI-expand transition length
window.render = (t) => {
  T = t;
  stage(); grid();
  let i = 0; for (let j = 0; j < SCENES.length; j++) if (t >= SCENES[j][0]) i = j;
  const t0 = SCENES[i][0], p = (t - t0) / TR;
  if (i > 0 && p < 1) {
    // previous scene recedes; new scene expands from its focus point inside a rounded window
    const e = eio(p);
    g.save(); g.globalAlpha = 1 - e * .7; g.translate(W / 2, H / 2); g.scale(1 - e * .06, 1 - e * .06); g.translate(-W / 2, -H / 2); drawScene(i - 1, t0 - .001); g.restore();
    const [fx, fy] = SCENES[i][2], ew = lerp(260, W + 40, e), eh = lerp(150, H + 40, e);
    const cx = lerp(fx, W / 2, e), cy = lerp(fy, H / 2, e);
    g.save(); rr(cx - ew / 2, cy - eh / 2, ew, eh, lerp(24, 0, e)); g.clip(); stage(); grid(); drawScene(i, t); g.restore();
    g.save(); rr(cx - ew / 2, cy - eh / 2, ew, eh, lerp(24, 0, e)); g.strokeStyle = `rgba(139,124,255,${.6 * (1 - e)})`; g.lineWidth = 2; g.stroke(); g.restore();
  } else drawScene(i, t);
  vignette();
  const cap = caption(t);
  window._cap = cap;
};
window.TEXTS = (t) => { window.render(t); return window._cap ? [window._cap] : []; };
window.EV = SCENES.slice(1).map(s => ({ t: s[0], type: 'whoosh' }));

// fonts
const faces = [['Inter', 'Inter-Regular.otf', 400], ['Inter', 'Inter-Medium.otf', 500], ['Inter', 'Inter-SemiBold.otf', 600], ['Inter', 'Inter-Bold.otf', 700], ['Inter', 'Inter-ExtraBold.otf', 800], ['Inter Display', 'InterDisplay-Bold.otf', 700], ['JetBrains Mono', 'JetBrainsMono-SemiBold.ttf', 600]];
await Promise.all(faces.map(async ([fam, file, w]) => { try { const f = new FontFace(fam, `url(fonts/${file})`, { weight: String(w) }); await f.load(); document.fonts.add(f); } catch (e) { console.warn('font', file); } }));
window.render(0);
window.READY = true;
</script></body></html>
