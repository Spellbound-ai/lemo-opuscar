<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#07080c;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
const W = 1920, H = 1080, FPS = 24;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const CUES = await (await fetch('cues.json')).json();
const EDL = await (await fetch('edl.json')).json();
const GEO = await (await fetch('vn_geo.json')).json();
window.DUR = 464.0;

// ---------- palette ----------
// light editorial theme: paper + ink, matching the illustrated B-roll
const C = {
  bg: '#F3EDE1', s1: 'rgba(255,253,248,0.96)', s2: '#FFFFFF', s3: '#E2DACB',
  line: 'rgba(30,24,60,0.12)', t1: '#16141f', t2: '#4b4760', t3: '#8a8599',
  acc: '#5B3FE0', accD: '#E9E3FF', accSoft: 'rgba(91,63,224,0.14)', red: '#E0353C', redD: '#FFE6E4', ink: '#16141f',
};
const F = 'Be Vietnam Pro', FD = 'Be Vietnam Pro', FM = 'Be Vietnam Pro';
const FS = 1.28;          // global type scale (bigger text, no subtitles)
let FIT = null;           // right edge that left-aligned text must not cross (set inside cards)

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eo = k => 1 - Math.pow(1 - clamp(k), 3);
const eio = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const back = k => { k = clamp(k); const s = 1.3; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
let T = 0;
const P = (t0, d = .35) => clamp((T - t0) / d);
const IN = (t0, d = .35) => back(P(t0, d));
const EO = (t0, d = .5) => eo(P(t0, d));
const LIVE = (t0, t1, d = .3) => eo(P(t0, d)) * (1 - eo(P(t1 - d, d)));   // in at t0, out by t1
const hash = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function panel(x, y, w, h, o = {}) {
  const a = o.a ?? 1; if (a <= 0) return;
  g.save(); g.globalAlpha *= a;
  g.shadowColor = 'rgba(40,30,80,0.22)'; g.shadowBlur = 34; g.shadowOffsetY = 12;
  rr(x, y, w, h, o.r ?? 16); g.fillStyle = o.fill || C.s1; g.fill();
  g.shadowColor = 'transparent';
  g.lineWidth = o.lw || 1.5; g.strokeStyle = o.stroke || C.line; g.stroke();
  if (o.glow) { g.shadowColor = o.glow; g.shadowBlur = 30; g.strokeStyle = o.glow; g.lineWidth = 2; rr(x, y, w, h, o.r ?? 16); g.stroke(); }
  g.restore();
}
function tx(s, x, y, o = {}) {
  const a = o.a ?? 1; if (a <= 0) return 0;
  g.save(); g.globalAlpha *= a;
  let size = (o.size || 32) * (o.raw ? 1 : FS);
  const al = o.al || 'left', maxW = o.maxW ?? (FIT && al === 'left' ? FIT - x : null);
  g.font = `${o.w || 500} ${size}px "${o.f || F}"`;
  if (o.ls) g.letterSpacing = o.ls + 'px';
  if (maxW && g.measureText(s).width > maxW) { size *= maxW / g.measureText(s).width; g.font = `${o.w || 500} ${size}px "${o.f || F}"`; }
  g.fillStyle = o.c || C.t1; g.textAlign = al; g.textBaseline = 'alphabetic';
  if (o.glow) { g.shadowColor = o.glow; g.shadowBlur = o.gb || 30; }
  g.fillText(s, x, y);
  const w = g.measureText(s).width; g.restore(); return w;
}
function tw(s, size, w = 500, f = F) { g.save(); g.font = `${w} ${size * FS}px "${f}"`; const m = g.measureText(s).width; g.restore(); return m; }
function wrap(s, maxW, size, w = 500, f = F) {
  g.save(); g.font = `${w} ${size * FS}px "${f}"`; const words = s.split(' '), lines = []; let cur = '';
  for (const wd of words) { const tst = cur ? cur + ' ' + wd : wd; if (g.measureText(tst).width > maxW && cur) { lines.push(cur); cur = wd; } else cur = tst; }
  if (cur) lines.push(cur); g.restore(); return lines;
}
function label(s, x, y, o = {}) { return tx(s.toUpperCase(), x, y, { f: FM, size: o.size || 20, w: 700, c: o.c || C.t2, ls: 1.5, ...o }); }
function line(x1, y1, x2, y2, c = C.line, w = 2, a = 1) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); g.restore(); }
function dot(x, y, r, c, a = 1, glow) { if (a <= 0 || r <= 0) return; g.save(); g.globalAlpha *= a; if (glow) { g.shadowColor = glow; g.shadowBlur = r * 3; } g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.restore(); }
function ring(x, y, r, c, w = 2, a = 1, dash) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.strokeStyle = c; g.lineWidth = w; if (dash) g.setLineDash(dash); g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke(); g.restore(); }
function arc(x, y, r, a0, a1, c, w = 3, a = 1) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.arc(x, y, r, a0, a1); g.stroke(); g.restore(); }
function chip(s, x, y, o = {}) {
  const size = o.size || 26, h = size * FS * 1.9, w = tw(s, size, o.w || 600) + size * FS * 1.4;
  const xx = o.al === 'center' ? x - w / 2 : o.al === 'right' ? x - w : x;
  const k = o.k ?? 1; if (k <= 0) return w;
  g.save(); g.translate(xx + w / 2, y + h / 2); g.scale(k, k); g.translate(-(xx + w / 2), -(y + h / 2));
  panel(xx, y, w, h, { r: h / 2, fill: o.fill || C.s2, stroke: o.stroke || C.line, glow: o.glow, a: o.a });
  tx(s, xx + w / 2, y + h / 2 + size * FS * .36, { size, w: o.w || 600, c: o.c || C.t1, al: 'center', a: o.a });
  g.restore(); return w;
}
function check(x, y, s, k, c = C.acc) { if (k <= 0) return; g.save(); g.strokeStyle = c; g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
  const p = [[x - s * .5, y], [x - s * .15, y + s * .35], [x + s * .5, y - s * .4]], L1 = .4;
  g.moveTo(...p[0]); if (k < L1) g.lineTo(lerp(p[0][0], p[1][0], k / L1), lerp(p[0][1], p[1][1], k / L1)); else { g.lineTo(...p[1]); const q = (k - L1) / (1 - L1); g.lineTo(lerp(p[1][0], p[2][0], q), lerp(p[1][1], p[2][1], q)); }
  g.stroke(); g.restore(); }
function cross(x, y, s, k, c = C.red) { if (k <= 0) return; const a = clamp(k * 2), b = clamp(k * 2 - 1);
  line(x - s, y - s, lerp(x - s, x + s, a), lerp(y - s, y + s, a), c, 6); if (b > 0) line(x + s, y - s, lerp(x + s, x - s, b), lerp(y - s, y + s, b), c, 6); }
function strike(x, y, w, k, c = C.red) { if (k > 0) line(x, y, x + w * eo(k), y, c, 5); }
function scramble(val, t0, dur = .9) {
  const p = (T - t0) / dur; if (p >= 1) return val;
  return val.split('').map((ch, i) => (!/[0-9]/.test(ch) || p > (i + 1) / (val.length + 1)) ? ch : String(Math.floor(hash(Math.floor(T * 24) + i * 7) * 10))).join('');
}
function bigNum(s, x, y, size, o = {}) { return tx(s, x, y, { f: FD, w: 800, size, raw: true, ls: -size * .03, al: o.al || 'center', c: o.c || C.t1, a: o.a }); }

// ---- broadcast components ----
// lower third: kicker + title (+ sub), slides in from the left on an accent bar
function lowerThird(kicker, title, t0, t1, o = {}) {
  const a = LIVE(t0, t1, .35); if (a <= 0) return;
  const x = o.x ?? 96, size = o.size || 46, S = size * FS, sub = o.sub && o.sub.trim() ? o.sub : null;
  const kw = kicker ? tw(kicker.toUpperCase(), 20, 700) + kicker.length * 1.5 + 36 : 0;
  const w = Math.min(1728, Math.max(tw(title, size, 800), sub ? tw(sub, 28, 500) : 0, kw) + 84);
  const bh = S * 1.5 + (sub ? 28 * FS * 1.5 : 0) + 24, y = (o.y ?? 930) - bh;     // anchored to the bottom
  const ww = w * eo(P(t0, .45));
  g.save(); g.globalAlpha = a;
  g.beginPath(); g.rect(x - 20, y - 80, ww + 40, bh + 120); g.clip();
  panel(x, y, w, bh, { r: 14, fill: C.s2, stroke: 'rgba(0,0,0,0)' });
  g.fillStyle = o.c || C.acc; g.fillRect(x, y, 10, bh);
  if (kicker) { rr(x, y - 22 * FS - 26, kw, 22 * FS + 18, 8); g.fillStyle = o.c || C.acc; g.fill();
    tx(kicker.toUpperCase(), x + 18, y - 22, { size: 20, w: 700, c: '#fff', ls: 1.5 }); }
  tx(title, x + 40, y + 12 + S * 1.02, { size, w: 800, maxW: w - 70 });
  if (sub) tx(sub, x + 40, y + 12 + S * 1.02 + 28 * FS * 1.4, { size: 28, w: 500, c: C.t2, maxW: w - 70 });
  g.restore();
}
// callout card anchored on the right
function card(x, y, w, h, t0, t1, draw, o = {}) {
  const a = LIVE(t0, t1, .3); if (a <= 0) return;
  const k = .94 + .06 * back(P(t0, .4));
  g.save(); g.globalAlpha = a; g.translate(x + w / 2, y + h / 2); g.scale(k, k); g.translate(-x - w / 2, -y - h / 2);
  panel(x, y, w, h, { fill: o.fill || C.s1, stroke: o.stroke || C.line, glow: o.glow });
  FIT = x + w - 28; draw(x, y, w, h); FIT = null;
  g.restore();
}
function stamp(s, x, y, t0, t1, o = {}) {
  const a = LIVE(t0, t1, .25); if (a <= 0) return;
  const k = lerp(1.6, 1, eo(P(t0, .25))), size = o.size || 64, c = o.c || C.red;
  const w = tw(s, size, 800) / FS + 70, h = size * 1.6;
  g.save(); g.globalAlpha = a; g.translate(x, y); g.rotate(o.rot ?? -.06); g.scale(k, k);
  rr(-w / 2, -h / 2, w, h, 12); g.fillStyle = o.fill || '#fff'; g.fill(); g.lineWidth = 6; g.strokeStyle = c; g.stroke();
  tx(s, 0, size * .36, { size, w: 800, c, al: 'center', raw: true }); g.restore();
}
function hat(x, y, s, c = C.acc, a = 1) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.translate(x, y); g.scale(s, s); rr(-30, -6, 60, 14, 4); g.fillStyle = c; g.fill(); rr(-18, -24, 36, 20, 5); g.fill(); g.restore(); }
function person(x, y, s, c = C.t2, a = 1) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.translate(x, y); g.scale(s, s); dot(0, -14, 14, c); g.beginPath(); g.arc(0, 26, 24, Math.PI, 0); g.fillStyle = c; g.fill(); g.restore(); }

// ---------- background footage ----------
const cache = new Map();
function frameImg(n) {
  n = Math.max(1, Math.min(11136, n));
  if (cache.has(n)) return cache.get(n);
  const im = new Image(); im.src = `bg/${String(n).padStart(5, '0')}.jpg`;
  const p = im.decode().then(() => im); cache.set(n, p);
  if (cache.size > 40) cache.delete(cache.keys().next().value);
  return p;
}
function segAt(t) { let i = 0; for (let j = 0; j < EDL.length; j++) if (t >= EDL[j][0] - 1e-6) i = j; return i; }
// layouts: 'full' (Ken Burns, scrim), 'blur' (dim + blurred), 'pip' (footage window in a dark stage)
const LAYOUT = [
  [0, 'full'], [71.3, 'blur'], [78.7, 'pip', { x: 80, y: 150, w: 1040 }], [93.45, 'full'],
  [119.9, 'pip', { x: 1180, y: 110, w: 660 }], [134.2, 'full'], [174.9, 'blur'], [203.1, 'full'],
  [243.1, 'pip', { x: 1180, y: 120, w: 660 }], [254.2, 'blur'], [271.4, 'full'], [342.7, 'blur'], [354.1, 'full'], [367.1, 'pip', { x: 80, y: 150, w: 820 }],
  [376.9, 'pip', { x: 1180, y: 120, w: 660 }], [387.5, 'full'], [395.8, 'blur'], [410.5, 'full'], [417.0, 'pip', { x: 80, y: 180, w: 820 }],
  [423.6, 'full'],
];
function layoutAt(t) { let L = LAYOUT[0]; for (const l of LAYOUT) if (t >= l[0]) L = l; return L; }
function drawFootage(img, t, mode, prm) {
  const i = segAt(t), s0 = EDL[i][0], s1 = EDL[i + 1]?.[0] ?? window.DUR;
  const q = clamp((t - s0) / (s1 - s0)), dir = i % 2 ? 1 : -1;
  const z = 1.02 + .06 * (i % 2 ? q : 1 - q), px = dir * 22 * (q - .5);
  if (mode === 'full' || mode === 'blur') {
    g.save();
    if (mode === 'blur') g.filter = 'blur(18px) saturate(0.6)';
    const zw = W * z * (mode === 'blur' ? 1.06 : 1), zh = H * z * (mode === 'blur' ? 1.06 : 1);
    g.drawImage(img, (W - zw) / 2 + px, (H - zh) / 2, zw, zh);
    g.restore();
    if (mode === 'blur') { g.fillStyle = 'rgba(243,237,225,0.78)'; g.fillRect(0, 0, W, H); }
  } else {   // pip window
    stage();
    const { x, y, w } = prm, h = w * 9 / 16;
    g.save(); g.shadowColor = 'rgba(40,30,80,.28)'; g.shadowBlur = 50; g.shadowOffsetY = 18; rr(x, y, w, h, 18); g.fillStyle = '#fff'; g.fill(); g.restore();
    g.save(); rr(x, y, w, h, 18); g.clip(); const zw = w * z, zh = h * z; g.drawImage(img, x + (w - zw) / 2 + px * w / W, y + (h - zh) / 2, zw, zh); g.restore();
    rr(x - 8, y - 8, w + 16, h + 16, 24); g.strokeStyle = '#fff'; g.lineWidth = 10; g.stroke();
  }
}
function stage() {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  g.save(); g.fillStyle = 'rgba(60,40,20,0.035)'; for (let i = 0; i < 1400; i++) g.fillRect(hash(i) * W, hash(i + 9e3) * H, 2, 2); g.restore();   // paper tooth
}

// ---------- persistent bug (top-left) ----------
const CHAPTERS = [[0, 'Hội chẩn'], [62.9, 'MAI-DxO'], [108.7, 'Bản chất'], [157.1, 'Bóc tách số liệu'], [254.2, 'Việt Nam'], [282.8, 'Ba vị trí của AI'], [322.5, 'Ba ranh giới'], [393.8, 'Bốn câu hỏi'], [423.6, 'Kết']];
function bug(t) {
  let ch = CHAPTERS[0], ci = 0; CHAPTERS.forEach((c, i) => { if (t >= c[0]) { ch = c; ci = i; } });
  const a = clamp((t - .4) / .4) * clamp((462.5 - t) / .5);
  g.save(); g.globalAlpha = a;
  rr(56, 40, 300, 30 * FS, 6); g.fillStyle = C.acc; g.fill();
  label('Tập 35 · AI & Y tế', 72, 69, { c: '#fff', size: 18 });
  const k = eo((t - ch[0]) / .5), w = tw(ch[1].toUpperCase(), 18, 600, FM) + ch[1].length * 2.5 + 28;
  rr(56, 80, w * k, 30 * FS, 6); g.fillStyle = 'rgba(255,255,255,.92)'; g.fill();
  if (k > .5) label(ch[1], 70, 109, { size: 18, c: C.acc, a: (k - .5) * 2 });
  g.restore();
}

// ============ OVERLAYS ============
const SEAT_T = [[6.2, 11.0], [11.8, 17.5], [18.1, 24.4], [25.4, 31.3], [32.0, 39.3]];
const ROLES = ['Giả thuyết', 'Chọn xét nghiệm', 'Phản biện', 'Chi phí', 'Kiểm tra'];
function seatRail(t0, t1, act, o = {}) {
  const a = LIVE(t0, t1, .4); if (a <= 0) return;
  const x = 1720, y0 = 230;
  g.save(); g.globalAlpha = a;
  for (let i = 0; i < 5; i++) {
    const y = y0 + i * 108, on = act(i), k = IN(t0 + i * .15, .35);
    g.save(); g.translate(x, y); g.scale(k, k);
    dot(0, 0, 44, on > .5 ? C.accD : C.s2); ring(0, 0, 44, on > 0 ? C.acc : 'rgba(30,24,60,.3)', on > 0 ? 3.5 : 1.5);
    if (on > 0) ring(0, 0, 44 + 10 * on, C.acc, 2, .5 * on);
    if (o.hats) hat(0, -4, .9, C.acc, 1); else person(0, 0, .85, on > 0 ? C.acc : C.t2);
    g.restore();
    chip(o.hats ? ROLES[i] : 'Người ' + String(i + 1).padStart(2, '0'), x - 60, y - 22, { size: 20, w: 700, al: 'right', k, fill: on > 0 ? C.acc : C.s2, c: on > 0 ? '#fff' : C.t1, stroke: 'rgba(0,0,0,0)' });
  }
  g.restore();
}
const seatAct = i => { const [a, b] = SEAT_T[i]; return clamp((T - a) / .3) * clamp((b + .3 - T) / .3); };

function ovCouncil() {
  lowerThird('Hội chẩn', 'Một ca bệnh khó', .4, 6.0, { sub: 'Năm người · một hồ sơ' });
  seatRail(3.4, 46.0, seatAct);
  // speaker cards (left)
  const cx = 96, cy = 470, cw = 760;
  card(cx, cy, cw, 230, 7.9, 11.6, (x, y) => {
    label('Người 01 · ba khả năng cao nhất', x + 32, y + 50, { c: C.acc });
    [['A', .58], ['B', .27], ['C', .15]].forEach(([n, v], j) => { const yy = y + 90 + j * 46, k = EO(8.3 + j * .35, .6);
      tx('Giả thuyết ' + n, x + 32, yy + 22, { size: 26, w: 650, a: k }); rr(x + 260, yy + 4, 440, 24, 8); g.fillStyle = 'rgba(30,24,60,.08)'; g.fill();
      rr(x + 260, yy + 4, 440 * v * k, 24, 8); g.fillStyle = j ? '#5c6380' : C.acc; g.fill(); });
  });
  card(cx, cy, cw, 230, 11.8, 18.0, (x, y) => {
    label('Người 02 · ba xét nghiệm phân biệt', x + 32, y + 50, { c: C.acc });
    ['XN-1', 'XN-2', 'XN-3'].forEach((s, j) => { chip(s, x + 32 + j * 170, y + 90, { k: IN(14.0 + j * .45), size: 28, stroke: C.acc });
      tx(['→ A', '→ B', '→ C'][j], x + 60 + j * 170, y + 190, { size: 24, w: 600, c: C.t2, a: EO(15.8 + j * .3) }); });
  });
  card(cx, cy, cw, 230, 18.1, 25.0, (x, y) => {
    label('Người 03 · phản biện', x + 32, y + 50, { c: C.red });
    tx('Dấu hiệu không khớp', x + 32, y + 112, { size: 42, w: 750, a: EO(19.9) });
    tx('với giả thuyết A', x + 32, y + 162, { size: 34, w: 600, c: C.red, a: EO(21.0) });
    tx('“Đừng vội kết luận”', x + 32, y + 206, { size: 24, w: 500, c: C.t2, a: EO(22.7) });
  }, { stroke: C.red });
  card(cx, cy, cw, 230, 25.4, 31.7, (x, y) => {
    label('Người 04 · chi phí', x + 32, y + 50, { c: C.acc });
    tx('Xét nghiệm đắt · ít giá trị', x + 32, y + 112, { size: 36, w: 700, c: T > 28 ? C.t3 : C.t1 });
    strike(x + 28, y + 100, tw('Xét nghiệm đắt · ít giá trị', 36, 700) + 10, P(27.6, .5));
    chip('Phương án rẻ hơn → làm trước', x + 32, y + 140, { k: IN(29.7), size: 26, fill: C.accD, stroke: C.acc });
  });
  card(cx, cy, cw, 230, 32.0, 40.0, (x, y) => {
    label('Người 05 · im lặng kiểm tra', x + 32, y + 50, { c: C.acc });
    [['Tên xét nghiệm ghi đúng', 35.8], ['Lập luận không mâu thuẫn', 37.6]].forEach(([s, t], j) => { check(x + 52, y + 104 + j * 62, 30, P(t, .4)); tx(s, x + 88, y + 116 + j * 62, { size: 30, w: 600, a: EO(t - .3) }); });
  });
  card(cx, cy, cw, 230, 40.2, 46.2, (x, y) => {
    label('Sau vài vòng tranh luận', x + 32, y + 50);
    for (let r = 0; r < 3; r++) chip('Vòng ' + (r + 1), x + 32 + r * 160, y + 76, { k: IN(40.4 + r * .5), size: 24, fill: r === 2 ? C.accD : C.s2 });
    const k = IN(43.0, .4); if (k > 0) { g.save(); g.translate(x + 32, y + 150); g.scale(k, k); chip('ĐÃ CHỐT CHẨN ĐOÁN', 0, 0, { size: 30, w: 800, fill: C.acc, c: '#fff', stroke: C.acc }); g.restore(); }
  }, { glow: T > 43 ? 'rgba(91,63,224,.6)' : null });
}

function ovTwist() {
  lowerThird('Quen thuộc', 'Một buổi hội chẩn tử tế', 46.5, 51.0, { sub: 'Bác sĩ lâu năm nào cũng thấy cảnh này' });
